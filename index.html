    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Halalas University Portal</title>
    <link rel="icon" href="imgs/halalas-university-logo.png" type="image/png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="js/app-config.js?v=20260926" defer></script>
    <link rel="stylesheet" type="text/css" href="css/main.css?v=20260926" />
    <link rel="stylesheet" type="text/css" href="css/dashboard.css?v=20260926" />
    <link rel="stylesheet" type="text/css" href="css/loading.css?v=20260926" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Halalas University" />
    <meta name="apple-mobile-web-app-title" content="Halalas University" />
    <meta name="theme-color" content="currentColor" />
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
</head>

<body>
    <div class="login-wrapper" id="loginWrapper" style="display: none;">
        <img src="imgs/halalas-university-logo.png" alt="Halalas University Portal" width="200" id="logo" data-app-logo>
        <div class="login-container">
        <h2>WELCOME TO <span data-app-name>HALALAS UNIVERSITY</span></h2>
        <p class="login-status" id="loginStatus" role="alert" hidden></p>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Εισάγετε το email σας" required />
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Εισάγετε τον κωδικό σας" required />
        </div>

        <div class="remember-group">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">Remember Me</label>
        </div>
        <p class="remember-hint">Διατήρηση σύνδεσης σε αυτή τη συσκευή</p>

        <div class="loginbtn-group">
            <button type="submit" class="login-btn">Login</button>
        </div>
        </div>
    </div>

    <!-- Το Block του Dashboard -->
    <div class="sd-wrapper" id="studentDashboardBlock">
        <div class="sd-header">
            <img src="imgs/halalas-university-logo.png" alt="Halalas University Portal" class="sd-logo" data-app-logo>
            <div class="sd-header-actions">
                <div>
                    <h2 id="sdStudentName">Φόρτωση...</h2>
                    <p>Αριθμός Μητρώου: <span id="sdStudentID">-</span></p>
                </div>
                <button class="sd-signout-btn" id="signOutBtn" type="button">Sign out</button>
            </div>
        </div>

        <div class="sd-content">
            <div class="sd-toolbar" role="status" aria-live="polite">
                <div class="sd-status-block">
                    <span class="sd-status-dot" aria-hidden="true"></span>
                    <span id="dashboardStatus">Συνδεδεμένος</span>
                    <span class="sd-last-updated" id="lastUpdated"></span>
                </div>
                <div class="sd-toolbar-actions">
                    <label class="sd-notification-toggle" id="notificationToggle" hidden>
                        <span>Ειδοποιήσεις για νέους βαθμούς</span>
                        <input type="checkbox" id="notificationToggleInput" />
                        <span class="sd-toggle-track" aria-hidden="true"><span></span></span>
                    </label>
                    <button class="sd-refresh-btn" id="refreshBtn" type="button">Ανανέωση</button>
                </div>
            </div>

            <!-- Πρώτο και ανοιχτό εξ ορισμού: είναι το μόνο κομμάτι της σελίδας
                 που λήγει. Η λίστα μαθημάτων από κάτω δεν αλλάζει μέσα στο
                 εξάμηνο, οπότε δεν χάνει τίποτα αν ξεκινά κλειστή. -->
            <section class="sd-category is-open">
                <button class="sd-category-toggle" type="button" aria-expanded="true" aria-controls="sdAssignmentsPanel">
                    <span>
                        Εκκρεμότητες
                        <!-- Ο αριθμός μένει ορατός και με κλειστό το section —
                             αλλιώς μια προθεσμία θα κρυβόταν πίσω από ένα κλικ. -->
                        <span class="sd-pending-badge" id="assignmentsBadge" hidden></span>
                    </span>
                    <span class="sd-category-chevron" aria-hidden="true">⌄</span>
                </button>
                <div class="sd-category-content" id="sdAssignmentsPanel">
                    <!-- Ένα wrapper, για τον ίδιο λόγο που το έχει και το
                         ιστορικό: το grid-template-rows: 0fr του κλεισίματος
                         διαστασιολογεί μόνο την πρώτη γραμμή. -->
                    <div class="sd-history-panel-inner">
                        <div class="sd-history-bar">
                            <label class="sd-notification-toggle" id="assignmentsShowDone">
                                <span>Δείξε και τα παραδομένα</span>
                                <input type="checkbox" id="assignmentsShowDoneInput" />
                                <span class="sd-toggle-track" aria-hidden="true"><span></span></span>
                            </label>
                            <div class="sd-history-actions">
                                <button class="sd-refresh-btn" id="assignmentsRefreshBtn" type="button">
                                    Ανανέωση
                                </button>
                            </div>
                        </div>
                        <p class="sd-history-note" id="assignmentsNote" role="status" aria-live="polite" hidden></p>
                        <div class="sd-assignments-list" id="sdAssignmentsList">
                            <!-- Οι εκκρεμότητες φορτώνονται μέσω JS -->
                        </div>
                    </div>
                </div>
            </section>

            <section class="sd-category">
                <button class="sd-category-toggle" type="button" aria-expanded="false" aria-controls="sdCoursesPanel">
                    <span>Τα Μαθήματά μου</span>
                    <span class="sd-category-chevron" aria-hidden="true">⌄</span>
                </button>
                <div class="sd-category-content" id="sdCoursesPanel">
                    <div class="sd-courses-grid" id="sdCoursesGrid">
                        <!-- Οι κάρτες φορτώνονται μέσω JS -->
                    </div>
                </div>
            </section>

            <section class="sd-category">
                <button class="sd-category-toggle" type="button" aria-expanded="false" aria-controls="sdEduportalPanel">
                    <span>Επίσημοι Βαθμοί (eduportal)</span>
                    <span class="sd-category-chevron" aria-hidden="true">⌄</span>
                </button>
                <div class="sd-category-content" id="sdEduportalPanel">
                    <div class="sd-courses-grid" id="sdEduportalGrid">
                        <!-- Οι κάρτες φορτώνονται μέσω JS -->
                    </div>
                </div>
            </section>

            <section class="sd-category">
                <button class="sd-category-toggle" type="button" aria-expanded="false" aria-controls="sdHistoryPanel">
                    <span>Ιστορικό Βαθμολογιών</span>
                    <span class="sd-category-chevron" aria-hidden="true">⌄</span>
                </button>
                <div class="sd-category-content" id="sdHistoryPanel">
                    <!-- Single wrapper on purpose: the collapse animation sets
                         grid-template-rows: 0fr on the panel, which only sizes
                         the first row — any further children land in implicit
                         auto rows and keep their full height while closed. -->
                    <div class="sd-history-panel-inner">
                    <div class="sd-history-bar">
                        <label class="sd-notification-toggle" id="historyToggle">
                            <span>Καταγραφή ιστορικού</span>
                            <input type="checkbox" id="historyToggleInput" />
                            <span class="sd-toggle-track" aria-hidden="true"><span></span></span>
                        </label>
                        <div class="sd-history-actions">
                            <select class="sd-history-filter" id="historyFilter" aria-label="Φίλτρο μαθήματος">
                                <option value="">Όλα τα μαθήματα</option>
                            </select>
                            <button class="sd-refresh-btn" id="historyBackfillBtn" type="button">
                                Εισαγωγή παλαιότερων
                            </button>
                        </div>
                    </div>
                    <p class="sd-history-note" id="historyNote" role="status" aria-live="polite" hidden></p>
                    <div class="sd-history-timeline" id="sdHistoryTimeline">
                        <!-- Οι εγγραφές φορτώνονται μέσω JS -->
                    </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <div class="dashboard-loader-wrapper" id="dashboard-loader-wrapper">
        <div class="grid"></div>

        <div class="loader-card">
            <div class="top">
                <div class="logo"></div>

                <div>
                    <h1>Loading Dashboard</h1>
                    <div class="subtitle">Fetching your dashboard data...</div>
                </div>
            </div>

            <div class="progress-wrapper">
                <div class="progress"></div>
            </div>

            <div class="steps">
                <div class="step">
                    <div class="left">
                        <div class="dot"></div>
                        <span class="message"></span>
                    </div>
                    <div class="spinner"></div>
                </div>
            </div>

            <div class="footer">
                <span>Secure encrypted connection</span>
                <span id="percent">0%</span>
            </div>
        </div>
    </div>
    <div class="app-modal" id="appModal" hidden>
        <div class="app-modal-backdrop" data-modal-cancel></div>
        <section class="app-modal-panel" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
            <button class="app-modal-close" type="button" aria-label="Κλείσιμο" data-modal-cancel>×</button>
            <p class="app-modal-kicker">Halalas University</p>
            <h2 id="appModalTitle"></h2>
            <p class="app-modal-message" id="appModalMessage"></p>
            <div class="app-modal-input-group" id="appModalInputGroup" hidden>
                <label for="appModalInput">Κωδικός</label>
                <input type="password" id="appModalInput" autocomplete="current-password" />
            </div>
            <div class="app-modal-actions">
                <button class="app-modal-secondary" type="button" data-modal-cancel>Ακύρωση</button>
                <button class="app-modal-primary" type="button" id="appModalConfirm">Συνέχεια</button>
            </div>
        </section>
    </div>
</body>
<script>
    const authBaseUrl = "https://uni-api.halalas-services.xyz/auth";
    const rememberSessionKey = "halalasRememberSession";
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberInput = document.getElementById("remember");
    const loginStatus = document.getElementById("loginStatus");
    const notificationToggle = document.getElementById("notificationToggle");
    const notificationToggleInput = document.getElementById("notificationToggleInput");
    const appModal = document.getElementById("appModal");
    const appModalTitle = document.getElementById("appModalTitle");
    const appModalMessage = document.getElementById("appModalMessage");
    const appModalInputGroup = document.getElementById("appModalInputGroup");
    const appModalInput = document.getElementById("appModalInput");
    const appModalConfirm = document.getElementById("appModalConfirm");

    let loginAttempt = 0;
    let dashboardReady = false;
    let loaderRunId = 0;
    let currentData = null;
    let messages = [];
    let notificationSetupPromise = null;
    const notificationsBaseUrl = "https://uni-api.halalas-services.xyz/notifications";
    const notificationsEnabledKey = "halalasNotificationsEnabled";
    let modalResolve = null;

    function closeAppModal(result = null) {
        if (!modalResolve) return;
        const resolve = modalResolve;
        modalResolve = null;
        appModal.classList.remove("is-visible");
        setTimeout(() => {
            appModal.hidden = true;
            appModalInput.value = "";
        }, 180);
        resolve(result);
    }

    function openAppModal({ title, message, confirmLabel = "Συνέχεια", input = false }) {
        return new Promise((resolve) => {
            modalResolve = resolve;
            appModalTitle.textContent = title;
            appModalMessage.textContent = message;
            appModalConfirm.textContent = confirmLabel;
            appModalInputGroup.hidden = !input;
            appModal.hidden = false;
            requestAnimationFrame(() => appModal.classList.add("is-visible"));
            setTimeout(() => (input ? appModalInput : appModalConfirm).focus(), 80);
        });
    }

    appModalConfirm.addEventListener("click", () => {
        closeAppModal(appModalInputGroup.hidden ? true : appModalInput.value);
    });
    appModal.querySelectorAll("[data-modal-cancel]").forEach((element) => {
        element.addEventListener("click", () => closeAppModal(null));
    });
    appModalInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") appModalConfirm.click();
    });
    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modalResolve) closeAppModal(null);
    });

    function supportsPushNotifications() {
        return "Notification" in window && "serviceWorker" in navigator && "PushManager" in window;
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
        const rawData = window.atob(base64);
        return Uint8Array.from([...rawData].map((character) => character.charCodeAt(0)));
    }

    async function getPushSubscription() {
        if (!supportsPushNotifications()) return null;

        if (Notification.permission === "denied") return null;
        const permission = Notification.permission === "granted"
            ? "granted"
            : await Notification.requestPermission();
        if (permission !== "granted") return null;

        const registration = await navigator.serviceWorker.register("/sw.js?v=20260926");
        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
            const keyResponse = await fetch(`${notificationsBaseUrl}/vapid-public-key`, {
                credentials: "include",
            });
            const keyData = await keyResponse.json();
            if (!keyResponse.ok || !keyData.ok || !keyData.publicKey) {
                throw new Error("VAPID_KEY_FAILED");
            }

            subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(keyData.publicKey),
            });
        }

        const subscribeResponse = await fetch(`${notificationsBaseUrl}/subscribe`, {
            credentials: "include",
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subscription: subscription.toJSON() }),
        });
        if (!subscribeResponse.ok) throw new Error("SUBSCRIBE_FAILED");
        return subscription;
    }

    function updateNotificationToggle() {
        if (!supportsPushNotifications()) {
            notificationToggle.hidden = true;
            return;
        }

        notificationToggle.hidden = false;
        notificationToggleInput.checked = localStorage.getItem(notificationsEnabledKey) === "true";
    }

    async function preparePushNotifications() {
        if (!supportsPushNotifications()) return;
        updateNotificationToggle();

        // Restore an existing opt-in silently, without requesting permission on page load.
        if (
            localStorage.getItem(notificationsEnabledKey) === "true" &&
            Notification.permission === "granted"
        ) {
            notificationSetupPromise = getPushSubscription().catch(() => null);
            await notificationSetupPromise;
        }
    }

    async function unregisterPushWorker() {
        const registration = await navigator.serviceWorker.getRegistration("/");
        if (!registration) return;

        const subscription = await registration.pushManager.getSubscription();
        if (subscription) await subscription.unsubscribe();
        await registration.unregister();
    }

    async function setNotificationsEnabled(enabled) {
        if (enabled) {
            const password = await openAppModal({
                title: "Ενεργοποίηση ειδοποιήσεων",
                message: "Εισάγετε ξανά τον κωδικό σας για να αποθηκεύσουμε τη συναίνεσή σας για τις ειδοποιήσεις βαθμών.",
                confirmLabel: "Ενεργοποίηση",
                input: true,
            });
            if (!password) {
                notificationToggleInput.checked = false;
                return;
            }

            try {
                const subscription = await getPushSubscription();
                if (!subscription) throw new Error("PUSH_PERMISSION_REQUIRED");
                const response = await fetch(`${notificationsBaseUrl}/enable`, {
                    credentials: "include",
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password }),
                });
                const data = await response.json();
                if (!response.ok || !data.ok) throw new Error("ENABLE_FAILED");
                localStorage.setItem(notificationsEnabledKey, "true");
            } catch {
                notificationToggleInput.checked = false;
                localStorage.removeItem(notificationsEnabledKey);
            }
            return;
        }

        try {
            const response = await fetch(`${notificationsBaseUrl}/disable`, {
                credentials: "include",
                method: "POST",
            });
            if (!response.ok) throw new Error("DISABLE_FAILED");
            await unregisterPushWorker();
            notificationSetupPromise = null;
            localStorage.removeItem(notificationsEnabledKey);
        } catch {
            notificationToggleInput.checked = true;
        }
    }

    function setLoginStatus(message) {
        loginStatus.textContent = message;
        loginStatus.hidden = !message;
    }

    function setDashboardStatus(message, isError = false) {
        const status = document.getElementById("dashboardStatus");
        status.textContent = message;
        status.classList.toggle("is-error", isError);
    }

    function setLastUpdated() {
        document.getElementById("lastUpdated").textContent =
            `Τελευταία ενημέρωση: ${new Intl.DateTimeFormat("el-GR", {
                dateStyle: "short",
                timeStyle: "short",
            }).format(new Date())}`;
    }

    async function startLogin(email, password) {
        const attemptId = ++loginAttempt;
        dashboardReady = false;
        setLoginStatus("");
        if (rememberInput.checked) {
            localStorage.setItem(rememberSessionKey, "true");
        } else {
            localStorage.removeItem(rememberSessionKey);
        }
        loaderRunId++;
        $(".dashboard-loader-wrapper").stop(true, true).hide();
        $("#loginWrapper").stop(true, true).fadeOut(300, () => {
            if (attemptId === loginAttempt && !dashboardReady) {
                RenderloadingScreen("login");
            }
        });

        try {
            const response = await fetch(`${authBaseUrl}/login`, {
                credentials: "include",
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: email,
                    password,
                    remember: rememberInput.checked,
                }),
            });
            const data = await response.json();
            if (attemptId !== loginAttempt) return;
            if (response.status === 401) returnToLogin("Λάθος στοιχεία σύνδεσης.");
            else if (response.status === 429) returnToLogin("Πολλές προσπάθειες, δοκίμασε ξανά σε λίγο.");
            else if (!response.ok || !data.ok) returnToLogin(data.message || "Δεν ήταν δυνατή η σύνδεση.");
            else renderDashboardData(data);
        } catch {
            if (attemptId === loginAttempt) returnToLogin("Δεν ήταν δυνατή η σύνδεση. Δοκίμασε ξανά.");
        }
    }

    async function restoreSession() {
        RenderloadingScreen("login");

        try {
            const response = await fetch(`${authBaseUrl}/session`, {
                credentials: "include",
            });
            const data = await response.json();

            if (response.ok && data.ok) {
                renderDashboardData(data);
            } else if (response.status === 401) {
                returnToLogin();
            } else {
                returnToLogin(data.message || "Δεν ήταν δυνατή η επαναφορά της σύνδεσης.");
            }
        } catch {
            returnToLogin("Δεν ήταν δυνατή η σύνδεση με τον server.");
        }
    }

    function renderDashboardData(data) {
        currentData = data;
        renderStudentDashboard(data);
        renderEduportalGrades(data.eduportalGrades);
        preparePushNotifications();
        loadHistory();
        // Το /auth/session κουβαλάει ήδη τις εκκρεμότητες, οπότε ζωγραφίζουμε
        // κατευθείαν από αυτό και γλιτώνουμε ένα request. Το loadAssignments()
        // μένει για το κουμπί και για την περίπτωση που λείπει το πεδίο (π.χ.
        // frontend νεότερο από το backend που τρέχει).
        if (data.assignments !== undefined) {
            applyAssignmentsPayload({ available: data.assignments !== null, assignments: data.assignments });
        } else {
            loadAssignments();
        }
    }

    document.querySelector(".login-btn").addEventListener("click", () => {
        startLogin(emailInput.value.trim(), passwordInput.value);
    });
    notificationToggleInput.addEventListener("change", () => {
        setNotificationsEnabled(notificationToggleInput.checked);
    });
    function setBodyHeight() {
        document.body.style.height = window.innerHeight + "px";
    }
    setBodyHeight();

    function returnToLogin(message = "") {
        loginAttempt++;
        dashboardReady = false;
        currentData = null;
        loaderRunId++;
        document.body.classList.remove("dashboard-mode");
        document.body.style.overflow = "hidden";
        setLoginStatus(message);
        $(".dashboard-loader-wrapper").stop(true, true).fadeOut(150);
        $("#studentDashboardBlock").stop(true, true).fadeOut(200);
        $(".login-wrapper").stop(true, true).fadeIn(250);
    }

    document.getElementById("signOutBtn").addEventListener("click", async () => {
        const shouldSignOut = await openAppModal({
            title: "Έξοδος από τον λογαριασμό",
            message: "Θέλετε να αποσυνδεθείτε από το Halalas University Portal;",
            confirmLabel: "Sign out",
        });
        if (!shouldSignOut) return;

        loginAttempt++;
        dashboardReady = false;
        loaderRunId++;
        fetch(`${authBaseUrl}/logout`, {
            credentials: "include",
            method: "POST",
        }).catch(() => {});

        document.body.classList.remove("dashboard-mode");
        document.body.style.overflow = "hidden";
        $("#studentDashboardBlock").stop(true, true).fadeOut(250, () => {
                document.getElementById("sdStudentName").textContent = "Φόρτωση...";
                document.getElementById("sdStudentID").textContent = "-";
                document.getElementById("sdCoursesGrid").innerHTML = "";
                document.getElementById("sdEduportalGrid").innerHTML = "";
                document.getElementById("sdHistoryTimeline").innerHTML = "";
                historyEntries = [];
                historyEnabled = false;
                historyToggleInput.checked = false;
                historyFilter.innerHTML = `<option value="">Όλα τα μαθήματα</option>`;
                setHistoryNote("");
                $(".dashboard-loader-wrapper").stop(true, true).hide();
                document.querySelectorAll(".sd-category").forEach((category, index) => {
                    const isOpen = index === 0;
                    category.classList.toggle("is-open", isOpen);
                    category.querySelector(".sd-category-toggle").setAttribute(
                        "aria-expanded",
                        String(isOpen),
                    );
                });
                passwordInput.value = "";
                emailInput.value = "";
                rememberInput.checked = false;
                localStorage.removeItem(rememberSessionKey);
                currentData = null;
                notificationSetupPromise = null;
                notificationToggleInput.checked = false;
                $(".login-wrapper").stop(true, true).fadeIn(250);
        });
    });

    async function refreshDashboardData() {
        if (!currentData) return;

        const refreshButton = document.getElementById("refreshBtn");
        refreshButton.disabled = true;
        setDashboardStatus("Ανανέωση δεδομένων...");

        try {
            const response = await fetch(`${authBaseUrl}/session`, {
                credentials: "include",
            });
            const data = await response.json();

            if (response.status === 429) throw new Error("RATE_LIMITED");
            if (response.status === 401) {
                returnToLogin("Η σύνδεση έληξε. Συνδέσου ξανά.");
                return;
            }
            if (!response.ok || !data.ok) throw new Error("REFRESH_FAILED");

            renderDashboardData(data);
            setDashboardStatus("Συνδεδεμένος");
            setLastUpdated();
        } catch (error) {
            setDashboardStatus(
                error.message === "RATE_LIMITED"
                    ? "Πολλές προσπάθειες. Δοκιμάστε ξανά αργότερα."
                    : "Η ανανέωση απέτυχε. Δοκιμάστε ξανά.",
                true,
            );
        } finally {
            refreshButton.disabled = false;
        }
    }

    document.querySelectorAll(".sd-category-toggle").forEach((toggle) => {
        toggle.addEventListener("click", () => {
            const category = toggle.closest(".sd-category");
            const isOpen = category.classList.toggle("is-open");
            toggle.setAttribute("aria-expanded", String(isOpen));

            if (isOpen) {
                document.querySelectorAll(".sd-category").forEach((otherCategory) => {
                    if (otherCategory === category) return;

                    otherCategory.classList.remove("is-open");
                    otherCategory
                        .querySelector(".sd-category-toggle")
                        .setAttribute("aria-expanded", "false");
                });
            }
        });
    });

    function renderStudentDashboard(responseData, isRefresh = false) {
        const user = responseData.user;

        if (!user) return;

        dashboardReady = true;
        setDashboardStatus("Συνδεδεμένος");
        setLastUpdated();

        // Συμπλήρωση στοιχείων φοιτητή (πάνω δεξιά)
        document.getElementById("sdStudentName").textContent = user.fullName;
        document.getElementById("sdStudentID").textContent = user.ID;

        const coursesGrid = document.getElementById("sdCoursesGrid");
        coursesGrid.innerHTML = "";

        const courses = Array.isArray(responseData.courses) ? responseData.courses : [];

        if (courses.length === 0) {
            coursesGrid.innerHTML =
                `<div class="sd-no-grades">Δεν βρέθηκαν μαθήματα για τον λογαριασμό σας.</div>`;
        }

        courses.forEach((course) => {
            const overallGrade = course.overallGrade ?? "-";
            const gradesData = Array.isArray(course.grades) ? course.grades : [];

            const card = document.createElement("div");
            card.className = "sd-course-card";

            // Το header της κάρτας που μπορεί να πατηθεί
            let cardHTML = `
            <div class="sd-card-header" tabindex="0" role="button" aria-expanded="false">
                <div class="sd-course-title">${course.name}</div>
                <div class="sd-overall-grade">
                    <span>Τελικός Βαθμός:</span>
                    <span>${overallGrade}</span>
                </div>
                <div class="sd-toggle-hint">
                    <span>Αναλυτική Βαθμολογία</span>
                    <span class="sd-chevron">▼</span>
                </div>
            </div>
            <div class="sd-grades-list">
        `;

            let hasValidGrades = false;

            gradesData.forEach((gradeItem) => {
                if (!gradeItem || Object.keys(gradeItem).length === 0) return;

                hasValidGrades = true;
                let name =
                    gradeItem.name !== "" ? gradeItem.name : "Γενικός Βαθμός / Αναγωγή";
                let gradeValue = gradeItem.grade !== null ? gradeItem.grade : "-";
                let gradeClass =
                    gradeItem.grade !== null
                        ? "sd-grade-value has-grade"
                        : "sd-grade-value";

                cardHTML += `
                <div class="sd-grade-item">
                    <span class="sd-grade-name">${name}</span>
                    <span class="${gradeClass}">${gradeValue}</span>
                </div> 
            `;
            });

            if (!hasValidGrades) {
                cardHTML += `<div class="sd-no-grades">Δεν υπάρχουν καταχωρημένες βαθμολογίες</div>`;
            }

            cardHTML += `</div>`;
            card.innerHTML = cardHTML;

            // Προσθήκη Event Listener στο header της κάρτας για να ανοιγοκλείνει
            const cardHeader = card.querySelector(".sd-card-header");
            const toggleCard = () => {
                const isExpanded = card.classList.toggle("expanded");
                cardHeader.setAttribute("aria-expanded", String(isExpanded));
            };

            cardHeader.addEventListener("click", toggleCard);
            cardHeader.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    toggleCard();
                }
            });

            coursesGrid.appendChild(card);
        });

        // Εμφάνιση του Dashboard (χρησιμοποιούμε flex για να δουλεύει σωστά το scroll)
        if (!isRefresh) RenderloadingScreen("collectDataEnd");
        // $(".dashboard-loader-wrapper").fadeOut("fast", () => {
        //     document.body.style.overflow = "hidden";
        //     // document.getElementById("studentDashboardBlock").style.display = "flex";
        //     document.getElementById("studentDashboardBlock").style.display = "flex";
        //     $("#studentDashboardBlock").fadeIn("fast");
        // });
    }

    // Δεδομένα από /eduportal-grades: [{ courseCode, title, grade, isPassed,
    // semester, examPeriod, units, ects, category, type, ... }, ...] — δομή
    // πολύ πιο απλή από τα Moodle δεδομένα, μία κάρτα ανά μάθημα χωρίς
    // αναλυτικά sub-items.
    function renderEduportalGrades(grades) {
        const grid = document.getElementById("sdEduportalGrid");
        grid.innerHTML = "";

        if (!Array.isArray(grades) || grades.length === 0) {
            grid.innerHTML = `<div class="sd-no-grades">Δεν βρέθηκαν επίσημοι βαθμοί</div>`;
            return;
        }

        const sortedGrades = [...grades].sort((firstCourse, secondCourse) =>
            String(firstCourse.courseCode ?? "").localeCompare(
                String(secondCourse.courseCode ?? ""),
                undefined,
                { numeric: true, sensitivity: "base" },
            ),
        );

        sortedGrades.forEach((course) => {
            const card = document.createElement("div");
            card.className = "sd-course-card";

            const gradeValue = course.grade !== null ? course.grade : "-";
            const gradeClass = course.isPassed ? "sd-overall-grade has-grade" : "sd-overall-grade";
            const statusLabel = course.isPassed ? "Πέρασε" : "Σε εκκρεμότητα";
            const courseMeta = [
                course.semester ? `Εξάμηνο: ${course.semester}` : "",
                course.examPeriod ? `Εξεταστική: ${course.examPeriod}` : "",
                course.units !== undefined ? `Μονάδες: ${course.units}` : "",
                course.ects !== undefined ? `ECTS: ${course.ects}` : "",
            ].filter(Boolean);

            card.innerHTML = `
                <div class="sd-card-header">
                    <div class="sd-course-title">${course.title} <span class="sd-course-code">(${course.courseCode})</span></div>
                    <div class="${gradeClass}">
                        <span>Βαθμός:</span>
                        <span>${gradeValue}</span>
                    </div>
                    <div class="sd-course-meta">
                        ${courseMeta.map((item) => `<span>${item}</span>`).join("")}
                    </div>
                    <div class="sd-course-status ${course.isPassed ? "is-passed" : "is-pending"}">
                        ${statusLabel}
                    </div>
                    <button class="sd-history-link" type="button" data-course="${course.courseCode}">
                        Ιστορικό μαθήματος
                    </button>
                </div>
            `;

            card.querySelector(".sd-history-link").addEventListener("click", () => {
                openHistoryFor(course.courseCode);
            });

            grid.appendChild(card);
        });
    }

    // Άνοιγμα της ενότητας ιστορικού φιλτραρισμένης σε ένα μάθημα, από την
    // κάρτα του eduportal.
    function openHistoryFor(courseCode) {
        const section = document.getElementById("sdHistoryPanel").closest(".sd-category");
        if (!section.classList.contains("is-open")) {
            section.querySelector(".sd-category-toggle").click();
        }

        if ([...historyFilter.options].some((option) => option.value === courseCode)) {
            historyFilter.value = courseCode;
        }
        renderHistory();
        section.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // ----------------------------------------------------------- Εκκρεμότητες
    // Δεδομένα από GET /assignments: { ok, available, pendingCount, assignments }
    // Κάθε εγγραφή: { id, name, courseId, courseName, moduleName, dueAt,
    //                 submitted, overdue, url }
    //
    // Το `available: false` σημαίνει ότι το Moodle δεν διαβάστηκε — ΔΕΝ είναι το
    // ίδιο με «δεν έχεις τίποτα». Αν τα ισοπεδώσουμε, μια αποτυχία θα
    // εμφανιζόταν σαν καθαρό ταμπλό, που είναι ο χειρότερος τρόπος να χαλάσει
    // αυτή η οθόνη.
    const assignmentsBaseUrl = "https://uni-api.halalas-services.xyz/assignments";

    const assignmentsBadge = document.getElementById("assignmentsBadge");
    const assignmentsNote = document.getElementById("assignmentsNote");
    const assignmentsList = document.getElementById("sdAssignmentsList");
    const assignmentsRefreshBtn = document.getElementById("assignmentsRefreshBtn");
    const assignmentsShowDoneInput = document.getElementById("assignmentsShowDoneInput");

    let assignmentEntries = [];
    let assignmentsAvailable = false;

    const DAY_MS = 24 * 60 * 60 * 1000;

    function setAssignmentsNote(message, isError = false) {
        assignmentsNote.textContent = message;
        assignmentsNote.hidden = !message;
        assignmentsNote.classList.toggle("is-error", isError);
    }

    // Πόσο μακριά είναι η προθεσμία, σε λόγια. Οι μέρες μετριούνται σε
    // ημερολογιακά μεσάνυχτα και όχι σε 24ωρα, γιατί «αύριο στις 09:00» είναι
    // αύριο ακόμα κι όταν απέχει 14 ώρες.
    function describeDue(dueAt, now = Date.now()) {
        if (!dueAt) return "χωρίς προθεσμία";

        const due = new Date(dueAt).getTime();
        if (Number.isNaN(due)) return "χωρίς προθεσμία";

        const startOfDay = (value) => {
            const date = new Date(value);
            date.setHours(0, 0, 0, 0);
            return date.getTime();
        };
        const days = Math.round((startOfDay(due) - startOfDay(now)) / DAY_MS);

        if (due < now) {
            if (days === 0) return "έληξε σήμερα";
            if (days === -1) return "έληξε χθες";
            return `έληξε πριν ${Math.abs(days)} μέρες`;
        }
        if (days === 0) return "λήγει σήμερα";
        if (days === 1) return "λήγει αύριο";
        if (days <= 7) return `σε ${days} μέρες`;
        return `σε ${days} μέρες`;
    }

    function formatDueStamp(dueAt) {
        if (!dueAt) return "";
        const date = new Date(dueAt);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("el-GR", { dateStyle: "medium", timeStyle: "short" }).format(date);
    }

    // Οι ομάδες είναι κατά επείγον, όχι κατά μάθημα: η ερώτηση που απαντά αυτή
    // η λίστα είναι «τι πρέπει να κάνω τώρα», και η απάντηση δεν εξαρτάται από
    // το ποιο μάθημα το ζήτησε.
    const ASSIGNMENT_GROUPS = [
        { key: "overdue", label: "Εκπρόθεσμες" },
        { key: "today", label: "Σήμερα και αύριο" },
        { key: "week", label: "Αυτή την εβδομάδα" },
        { key: "later", label: "Αργότερα" },
        { key: "undated", label: "Χωρίς προθεσμία" },
        { key: "done", label: "Παραδομένες" },
    ];

    function groupFor(assignment, now) {
        if (assignment.submitted) return "done";
        if (!assignment.dueAt) return "undated";

        const due = new Date(assignment.dueAt).getTime();
        if (Number.isNaN(due)) return "undated";
        if (due < now) return "overdue";
        if (due - now <= 2 * DAY_MS) return "today";
        if (due - now <= 7 * DAY_MS) return "week";
        return "later";
    }

    function renderAssignmentsBadge() {
        const pending = assignmentEntries.filter((entry) => !entry.submitted);
        if (!assignmentsAvailable || pending.length === 0) {
            assignmentsBadge.hidden = true;
            return;
        }

        assignmentsBadge.hidden = false;
        assignmentsBadge.textContent = String(pending.length);
        // Κόκκινο μόνο όταν κάτι έχει όντως λήξει ή λήγει μέσα σε 24 ώρες —
        // αλλιώς το σήμα είναι μονίμως κόκκινο και σταματά να σημαίνει κάτι.
        const urgent = pending.some(
            (entry) =>
                entry.overdue ||
                (entry.dueAt && new Date(entry.dueAt).getTime() - Date.now() <= DAY_MS),
        );
        assignmentsBadge.classList.toggle("is-urgent", urgent);
        assignmentsBadge.title = urgent ? "Υπάρχει προθεσμία που λήγει ή έληξε" : "Εκκρεμότητες";
    }

    function renderAssignments() {
        renderAssignmentsBadge();
        assignmentsList.innerHTML = "";

        if (!assignmentsAvailable) {
            assignmentsList.innerHTML =
                `<div class="sd-no-grades">Δεν μπορέσαμε να διαβάσουμε τις εργασίες από το Moodle. Δοκίμασε «Ανανέωση».</div>`;
            return;
        }

        const showDone = assignmentsShowDoneInput.checked;
        const visible = showDone ? assignmentEntries : assignmentEntries.filter((entry) => !entry.submitted);

        if (visible.length === 0) {
            assignmentsList.innerHTML = `<div class="sd-no-grades">${
                assignmentEntries.length === 0
                    ? "Δεν βρέθηκαν εργασίες με προθεσμία στο Moodle."
                    : "Καμία εκκρεμότητα — όλα παραδομένα."
            }</div>`;
            return;
        }

        const now = Date.now();
        const buckets = new Map(ASSIGNMENT_GROUPS.map((group) => [group.key, []]));
        visible.forEach((entry) => buckets.get(groupFor(entry, now)).push(entry));

        assignmentsList.innerHTML = ASSIGNMENT_GROUPS.filter((group) => buckets.get(group.key).length > 0)
            .map((group) => {
                const items = buckets
                    .get(group.key)
                    .map((entry) => {
                        const link = entry.url
                            ? `<a class="sd-assignment-link" href="${escapeHtml(entry.url)}" target="_blank" rel="noopener noreferrer">Άνοιγμα στο Moodle</a>`
                            : "";
                        const stamp = formatDueStamp(entry.dueAt);

                        return `
                            <article class="sd-assignment is-${escapeHtml(group.key)}">
                                <div class="sd-assignment-main">
                                    <div class="sd-assignment-name">${escapeHtml(entry.name)}</div>
                                    <div class="sd-assignment-course">${escapeHtml(entry.courseName)}</div>
                                </div>
                                <div class="sd-assignment-due">
                                    <span class="sd-assignment-relative">${escapeHtml(describeDue(entry.dueAt, now))}</span>
                                    ${stamp ? `<time datetime="${escapeHtml(entry.dueAt)}">${escapeHtml(stamp)}</time>` : ""}
                                    ${link}
                                </div>
                            </article>`;
                    })
                    .join("");

                return `
                    <div class="sd-assignment-group is-${escapeHtml(group.key)}">
                        <h3 class="sd-assignment-group-title">
                            ${escapeHtml(group.label)}
                            <span class="sd-assignment-group-count">${buckets.get(group.key).length}</span>
                        </h3>
                        ${items}
                    </div>`;
            })
            .join("");
    }

    function applyAssignmentsPayload(data) {
        assignmentsAvailable = Boolean(data.available);
        assignmentEntries = Array.isArray(data.assignments) ? data.assignments : [];
        renderAssignments();
    }

    async function loadAssignments() {
        try {
            const response = await fetch(assignmentsBaseUrl, { credentials: "include" });
            if (response.status === 401) return;

            const data = await response.json();
            if (!response.ok || !data.ok) throw new Error("ASSIGNMENTS_FAILED");

            applyAssignmentsPayload(data);
            setAssignmentsNote("");
        } catch (error) {
            // Κρατάμε ό,τι δείχναμε· ένα δίκτυο που κόπηκε δεν είναι λόγος να
            // σβήσουμε προθεσμίες από την οθόνη.
            setAssignmentsNote("Δεν φορτώθηκαν οι εκκρεμότητες.", true);
        }
    }

    async function refreshAssignments() {
        assignmentsRefreshBtn.disabled = true;
        setAssignmentsNote("Ανανέωση...");

        try {
            const response = await fetch(`${assignmentsBaseUrl}/refresh`, {
                method: "POST",
                credentials: "include",
            });
            const data = await response.json();

            if (response.status === 401) {
                returnToLogin("Η σύνδεση έληξε. Συνδέσου ξανά.");
                return;
            }
            // Το session επέζησε restart του server αλλά το Moodle token όχι —
            // η αποθηκευμένη λίστα παίζει κανονικά, μόνο η ανανέωση θέλει login.
            if (response.status === 409) {
                setAssignmentsNote("Χρειάζεται νέο login για ανανέωση. Η λίστα που βλέπεις είναι από την τελευταία σύνδεση.", true);
                return;
            }
            if (!response.ok || !data.ok) throw new Error("REFRESH_FAILED");

            applyAssignmentsPayload(data);
            setAssignmentsNote("Ενημερώθηκε.");
        } catch (error) {
            setAssignmentsNote("Η ανανέωση απέτυχε. Δοκίμασε ξανά.", true);
        } finally {
            assignmentsRefreshBtn.disabled = false;
        }
    }

    assignmentsRefreshBtn.addEventListener("click", refreshAssignments);
    assignmentsShowDoneInput.addEventListener("change", renderAssignments);

    // ---------------------------------------------------------------- Ιστορικό
    // Δεδομένα από GET /history/eduportal: { ok, enabled, total, history: [...] }
    // με νεότερη εγγραφή πρώτη. Κάθε εγγραφή:
    //   { at, approximateDate, source: "live"|"examPeriod",
    //     type: "baseline"|"new"|"changed", from?, courseCode, title,
    //     semester, examPeriod, grade, isPassed, modifiedAt?, observedAt? }
    const historyBaseUrl = "https://uni-api.halalas-services.xyz/history";
    const historyToggleInput = document.getElementById("historyToggleInput");
    const historyBackfillBtn = document.getElementById("historyBackfillBtn");
    const historyFilter = document.getElementById("historyFilter");
    const historyNote = document.getElementById("historyNote");
    const historyTimeline = document.getElementById("sdHistoryTimeline");

    let historyEntries = [];
    let historyEnabled = false;

    // A result is identified by (course, exam period): sitting a course again is
    // a new attempt even when the mark is identical, and only a revision inside
    // the *same* period is the registry correcting itself.
    const HISTORY_TYPE_LABELS = {
        baseline: "Αρχική καταγραφή",
        new: "Νέος βαθμός",
        retake: "Επανεξέταση",
        corrected: "Διόρθωση",
        changed: "Αλλαγή βαθμού", // ιστορικές εγγραφές πριν τον διαχωρισμό
    };

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[character]);
    }

    function setHistoryNote(message, isError = false) {
        historyNote.textContent = message;
        historyNote.hidden = !message;
        historyNote.classList.toggle("is-error", isError);
    }

    // Οι backdated εγγραφές ξέρουν μόνο μήνα/χρονιά — μη δείχνεις ώρα που δεν
    // την ξέρουμε.
    function formatHistoryDate(entry) {
        const date = new Date(entry.at);
        if (Number.isNaN(date.getTime())) return "—";

        if (entry.approximateDate) {
            return `~ ${new Intl.DateTimeFormat("el-GR", {
                month: "long",
                year: "numeric",
            }).format(date)}`;
        }
        return new Intl.DateTimeFormat("el-GR", {
            dateStyle: "medium",
            timeStyle: "short",
        }).format(date);
    }

    function renderHistoryFilterOptions() {
        const selected = historyFilter.value;
        const courses = new Map();
        historyEntries.forEach((entry) => {
            if (entry.courseCode && !courses.has(entry.courseCode)) {
                courses.set(entry.courseCode, entry.title || entry.courseCode);
            }
        });

        const sorted = [...courses.entries()].sort((first, second) =>
            first[0].localeCompare(second[0], undefined, { numeric: true, sensitivity: "base" }),
        );

        historyFilter.innerHTML =
            `<option value="">Όλα τα μαθήματα</option>` +
            sorted
                .map(([code, title]) =>
                    `<option value="${escapeHtml(code)}">${escapeHtml(code)} — ${escapeHtml(title)}</option>`)
                .join("");
        historyFilter.value = courses.has(selected) ? selected : "";
        historyFilter.disabled = sorted.length === 0;
    }

    function renderHistory() {
        historyTimeline.innerHTML = "";
        historyBackfillBtn.hidden = !historyEnabled;
        historyFilter.hidden = !historyEnabled;

        if (!historyEnabled) {
            historyTimeline.innerHTML =
                `<div class="sd-no-grades">Η καταγραφή ιστορικού είναι απενεργοποιημένη. Ενεργοποιήστε τη για να κρατάμε κάθε νέο και κάθε διορθωμένο βαθμό.</div>`;
            return;
        }

        const courseCode = historyFilter.value;
        const visible = courseCode
            ? historyEntries.filter((entry) => entry.courseCode === courseCode)
            : historyEntries;

        if (visible.length === 0) {
            historyTimeline.innerHTML = `<div class="sd-no-grades">${
                courseCode
                    ? "Δεν υπάρχουν εγγραφές για αυτό το μάθημα."
                    : "Δεν υπάρχουν εγγραφές ακόμα. Δοκιμάστε «Εισαγωγή παλαιότερων» για να φέρετε όλες τις εξεταστικές."
            }</div>`;
            return;
        }

        historyTimeline.innerHTML = visible
            .map((entry) => {
                const typeLabel = HISTORY_TYPE_LABELS[entry.type] || entry.type;
                const hasPrevious = entry.from !== null && entry.from !== undefined;
                // Only a correction genuinely replaces an earlier mark, so only
                // it gets the struck-through "was". A re-sit stands on its own
                // and carries the previous sitting as a footnote instead.
                const gradeText =
                    hasPrevious && (entry.type === "corrected" || entry.type === "changed")
                        ? `<span class="sd-history-from">${escapeHtml(entry.from)}</span>
                           <span class="sd-history-arrow" aria-hidden="true">→</span>
                           <span class="sd-history-grade">${escapeHtml(entry.grade)}</span>`
                        : `<span class="sd-history-grade">${escapeHtml(entry.grade)}</span>`;

                const previousNote =
                    entry.type === "retake" && hasPrevious
                        ? `<div class="sd-history-previous">Προηγούμενη προσπάθεια: ${escapeHtml(entry.from)}${
                              entry.fromExamPeriod ? ` (${escapeHtml(entry.fromExamPeriod)})` : ""
                          }</div>`
                        : "";

                const meta = [
                    entry.examPeriod ? `Εξεταστική: ${entry.examPeriod}` : "",
                    entry.semester ? `Εξάμηνο: ${entry.semester}` : "",
                    entry.source === "examPeriod" ? "από εξεταστική" : "",
                ].filter(Boolean);

                return `
                    <article class="sd-history-entry is-${escapeHtml(entry.type)}">
                        <div class="sd-history-when">
                            <time datetime="${escapeHtml(entry.at)}">${escapeHtml(formatHistoryDate(entry))}</time>
                            <span class="sd-history-badge">${escapeHtml(typeLabel)}</span>
                        </div>
                        <div class="sd-history-body">
                            <div class="sd-history-course">
                                ${escapeHtml(entry.title || entry.courseCode)}
                                <span class="sd-course-code">(${escapeHtml(entry.courseCode)})</span>
                            </div>
                            <div class="sd-history-grades ${entry.isPassed ? "is-passed" : "is-failed"}">
                                ${gradeText}
                            </div>
                            ${previousNote}
                            ${meta.length
                                ? `<div class="sd-course-meta">${meta
                                      .map((item) => `<span>${escapeHtml(item)}</span>`)
                                      .join("")}</div>`
                                : ""}
                        </div>
                    </article>`;
            })
            .join("");
    }

    async function loadHistory() {
        try {
            const response = await fetch(`${historyBaseUrl}/eduportal?limit=200`, {
                credentials: "include",
            });
            if (response.status === 401) return;

            const data = await response.json();
            if (!response.ok || !data.ok) throw new Error("HISTORY_FAILED");

            historyEnabled = data.enabled === true;
            historyEntries = Array.isArray(data.history) ? data.history : [];
            historyToggleInput.checked = historyEnabled;
            renderHistoryFilterOptions();
            renderHistory();
            setHistoryNote("");
        } catch {
            setHistoryNote("Δεν ήταν δυνατή η φόρτωση του ιστορικού.", true);
        }
    }

    async function setHistoryEnabled(enabled) {
        if (!enabled) {
            const confirmed = await openAppModal({
                title: "Απενεργοποίηση ιστορικού",
                message: "Η καταγραφή σταματά και οι εγγραφές που έχουν κρατηθεί διαγράφονται. Θέλετε να συνεχίσετε;",
                confirmLabel: "Απενεργοποίηση",
            });
            if (!confirmed) {
                historyToggleInput.checked = true;
                return;
            }
        }

        historyToggleInput.disabled = true;
        try {
            const response = await fetch(`${historyBaseUrl}/${enabled ? "enable" : "disable"}`, {
                credentials: "include",
                method: "POST",
            });
            if (!response.ok) throw new Error("TOGGLE_FAILED");
            await loadHistory();
            setHistoryNote(
                enabled
                    ? "Η καταγραφή ενεργοποιήθηκε. Από εδώ και πέρα κρατάμε κάθε αλλαγή."
                    : "Η καταγραφή απενεργοποιήθηκε.",
            );
        } catch {
            historyToggleInput.checked = !enabled;
            setHistoryNote("Η αλλαγή δεν ήταν δυνατή. Δοκιμάστε ξανά.", true);
        } finally {
            historyToggleInput.disabled = false;
        }
    }

    // Το backfill διαβάζει κάθε εξεταστική περίοδο ξεχωριστά, άρα φέρνει και
    // προσπάθειες που δεν φαίνονται στην τρέχουσα βαθμολογία. Ο κωδικός
    // χρησιμοποιείται μια φορά για αυτό το αίτημα και δεν αποθηκεύεται.
    async function runBackfill() {
        const password = await openAppModal({
            title: "Εισαγωγή παλαιότερων βαθμών",
            message: "Θα διαβάσουμε όλες τις εξεταστικές περιόδους από το eduportal, μαζί με βαθμούς που δεν φαίνονται πια στην τρέχουσα βαθμολογία. Εισάγετε τον κωδικό σας — χρησιμοποιείται μόνο για αυτό και δεν αποθηκεύεται.",
            confirmLabel: "Εισαγωγή",
            input: true,
        });
        if (!password) return;

        historyBackfillBtn.disabled = true;
        setHistoryNote("Εισαγωγή από το eduportal... μπορεί να πάρει ένα λεπτό.");

        try {
            const response = await fetch(`${historyBaseUrl}/backfill`, {
                credentials: "include",
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password }),
            });
            const data = await response.json();

            if (response.status === 401) throw new Error("INVALID_CREDENTIALS");
            if (!response.ok || !data.ok) throw new Error("BACKFILL_FAILED");

            await loadHistory();
            const failed = Array.isArray(data.failedPeriods) ? data.failedPeriods.length : 0;
            setHistoryNote(
                `Εισήχθησαν ${data.entries} εγγραφές από ${data.periods} εξεταστικές.` +
                    (failed ? ` ${failed} εξεταστικές δεν διαβάστηκαν — δοκιμάστε ξανά αργότερα.` : ""),
                failed > 0,
            );
        } catch (error) {
            setHistoryNote(
                error.message === "INVALID_CREDENTIALS"
                    ? "Λάθος κωδικός."
                    : "Η εισαγωγή απέτυχε. Δοκιμάστε ξανά.",
                true,
            );
        } finally {
            historyBackfillBtn.disabled = false;
        }
    }

    historyToggleInput.addEventListener("change", () => {
        setHistoryEnabled(historyToggleInput.checked);
    });
    historyBackfillBtn.addEventListener("click", runBackfill);
    historyFilter.addEventListener("change", renderHistory);

    function RenderloadingScreen(state) {
        const currentLoaderRunId = ++loaderRunId;
        const step = $(".step");
        const progress = $(".progress");
        const percentText = $("#percent");
        const messageText = $(".message");
        const spinner = $(".spinner");

        step.removeAttr("style");
        spinner.removeAttr("style").empty();
        progress.css("width", "0%");
        percentText.text("0%");
        let current = 0;
        if (state === "login") {
            messages = ["Συλλογή μαθημάτων...", "Συλλογή επίσημων βαθμών..."];
            messageText.text("Έλεγχος στοιχείων σύνδεσης...");
        } else if (state === "collectDataEnd") {
            current = messages.length;
        }
        function runLoader() {
            if (currentLoaderRunId !== loaderRunId) return;

            if (current >= messages.length) {
                if (!dashboardReady) return;

                spinner.html("✓");
                spinner.css({
                    animation: "none",
                    border: "none",
                    color: "#4ade80",
                    fontSize: "18px",
                });

                messageText.text("Τα δεδομένα είναι έτοιμα.");
                progress.css("width", "100%");
                percentText.text("100%");
                $(".dashboard-loader-wrapper").fadeOut("fast", () => {
                    document.body.style.overflow = "hidden";
                    document.body.classList.add("dashboard-mode");
                    // document.getElementById("studentDashboardBlock").style.display = "flex";
                    document.getElementById("studentDashboardBlock").style.display =
                        "flex";
                    $("#studentDashboardBlock").fadeIn("fast");
                });
                return;
            }

            step.css({
                opacity: "0",
                transform: "translateY(10px)",
            });
            setTimeout(() => {
                if (currentLoaderRunId !== loaderRunId) return;

                messageText.text(messages[current]);

                step.css({
                    opacity: "1",
                    transform: "translateY(0)",
                });

                const percent = ((current + 1) / messages.length) * 100;

                progress.css("width", percent + "%");
                percentText.text(Math.round(percent) + "%");

                current++;

                setTimeout(runLoader, 1400);
            }, 300);
        }

        setTimeout(runLoader, state === "collectDataEnd" ? 0 : 700);
        document.getElementById("dashboard-loader-wrapper").style.display =
            "flex";
    }

    if (localStorage.getItem(rememberSessionKey) === "true") {
        restoreSession();
    } else {
        returnToLogin();
    }
</script>

</html>
